zend_extension=xdebug.so

; Modes possibles: develop, debug, coverage, trace, profile, gcstats, dump
xdebug.mode=debug

; Activation du debug à chaque requête (pratique pour dev)
xdebug.start_with_request=yes

; Permet à Xdebug de détecter automatiquement l’hôte VS Code
xdebug.discover_client_host=true

; Port par défaut pour VS Code
xdebug.client_port=9003

; Logs Xdebug (utile si besoin de debug PHP<->VSCode)
xdebug.log=/tmp/xdebug.log
xdebug.log_level=0

; Optionnel: limiter la verbosité
xdebug.max_nesting_level=512
